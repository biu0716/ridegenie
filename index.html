<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideGenie — 智能骑行路线生成器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');
  :root{--bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3345;--text:#e4e6ed;--text-dim:#8b8fa3;--accent:#4ade80;--accent-dim:#22c55e;--accent-glow:rgba(74,222,128,.15);--blue:#60a5fa;--red:#f87171}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .app{display:flex;height:100vh}
  .sidebar{width:380px;min-width:380px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
  .sidebar-header{padding:20px 24px;border-bottom:1px solid var(--border)}
  .logo{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--accent)}.logo span{color:var(--text-dim);font-weight:400;font-size:13px;margin-left:8px}
  .sidebar-body{flex:1;overflow-y:auto;padding:20px 24px}
  .sidebar-body::-webkit-scrollbar{width:4px}.sidebar-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .main{flex:1;position:relative;display:flex;flex-direction:column}
  #map-container{flex:1}
  .form-section{margin-bottom:20px}
  .form-section-title{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:12px}
  .form-input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
  .form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .form-input::placeholder{color:var(--text-dim);opacity:.6}
  .distance-display{display:flex;align-items:baseline;gap:4px;margin-bottom:8px}
  .distance-value{font-family:'Space Mono',monospace;font-size:32px;font-weight:700;color:var(--accent);line-height:1}
  .distance-unit{font-size:14px;color:var(--text-dim)}
  input[type=range]{width:100%;-webkit-appearance:none;height:6px;background:var(--surface2);border-radius:3px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer}
  .range-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-top:4px;font-family:'Space Mono',monospace}
  .chip-group{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:7px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:13px;color:var(--text-dim);cursor:pointer;user-select:none;transition:all .2s}
  .chip:hover{border-color:var(--accent);color:var(--text)}.chip.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent);font-weight:500}
  .direction-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:140px;margin:0 auto}
  .dir-btn{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-size:12px;cursor:pointer;font-family:'Space Mono',monospace;transition:all .2s}
  .dir-btn:hover{border-color:var(--accent)}.dir-btn.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent);font-weight:700}
  .dir-btn.center{background:transparent;border-style:dashed}.dir-btn.center.active{border-style:solid}
  .poi-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .poi-tag{display:flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.3);border-radius:14px;font-size:12px;color:var(--blue)}
  .poi-tag .rm{cursor:pointer;opacity:.6;font-size:10px}.poi-tag .rm:hover{opacity:1}
  .quick-poi{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .qp{padding:5px 12px;background:transparent;border:1px dashed var(--border);border-radius:14px;font-size:12px;color:var(--text-dim);cursor:pointer;transition:all .2s}
  .qp:hover{border-color:var(--blue);color:var(--blue);border-style:solid}.qp.sel{background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.3);color:var(--blue)}
  .sbox{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:200px;overflow-y:auto;z-index:100;display:none}
  .sbox.show{display:block}
  .si{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);color:var(--text);transition:background .15s}
  .si:last-child{border-bottom:none}.si:hover{background:var(--surface2)}.si .ad{color:var(--text-dim);font-size:11px;margin-top:2px}
  .gen-btn{width:100%;padding:14px;background:var(--accent);color:var(--bg);border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
  .gen-btn:hover{background:var(--accent-dim);transform:translateY(-1px);box-shadow:0 4px 20px var(--accent-glow)}
  .gen-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .sidebar-footer{padding:16px 24px;border-top:1px solid var(--border)}
  .rpanel{position:absolute;top:16px;right:16px;width:320px;z-index:10;display:none}.rpanel.show{display:block}
  .rcard{background:rgba(26,29,39,.92);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;backdrop-filter:blur(10px);transition:all .2s}
  .rcard:hover{border-color:var(--accent)}.rcard.active{border-color:var(--accent);box-shadow:0 0 20px var(--accent-glow)}
  .rcard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .rcard-title{font-family:'Space Mono',monospace;font-size:14px;font-weight:700}
  .rcard-badge{padding:3px 8px;border-radius:10px;font-size:11px;font-family:'Space Mono',monospace}
  .rstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rsl{font-size:11px;color:var(--text-dim)}.rsv{font-family:'Space Mono',monospace;font-size:14px;font-weight:700}
  .epanel{height:140px;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;display:none}.epanel.show{display:block}
  .etitle{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:8px}
  #ecanvas{width:100%;height:90px}
  .lov{position:absolute;inset:0;background:rgba(15,17,23,.85);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:16px}
  .lov.show{display:flex}
  .lspin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ltxt{color:var(--text-dim);font-size:14px;animation:pu 1.5s ease-in-out infinite}@keyframes pu{50%{opacity:.5}}
  .mempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;pointer-events:none}
  .noti{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:14px;color:var(--text);z-index:1000;transition:transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .noti.show{transform:translateX(-50%) translateY(0)}.noti.error{border-color:var(--red)}.noti.success{border-color:var(--accent)}
  #dbg{position:fixed;bottom:0;left:0;right:0;height:150px;background:#111;color:#0f0;font:11px/1.4 monospace;padding:8px;overflow-y:auto;z-index:9999;border-top:2px solid #333}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header"><div class="logo">RideGenie <span>智能骑行路线</span></div></div>
    <div class="sidebar-body">
      <div class="form-section"><div class="form-section-title">📍 出发点</div><div style="position:relative"><input class="form-input" id="si" placeholder="搜索地址或点击地图选点" autocomplete="off"><div class="sbox" id="ss"></div></div></div>
      <div class="form-section"><div class="form-section-title">🛣 目标里程</div><div class="distance-display"><div class="distance-value" id="dd">30</div><div class="distance-unit">km</div></div><input type="range" id="ds" min="10" max="100" step="5" value="30"><div class="range-labels"><span>10km</span><span>50km</span><span>100km</span></div></div>
      <div class="form-section"><div class="form-section-title">🏙 骑行区域</div><div class="chip-group" data-name="area"><div class="chip" data-value="urban">市区</div><div class="chip active" data-value="suburban">郊区</div><div class="chip" data-value="any">都行</div></div></div>
      <div class="form-section"><div class="form-section-title">🛤 路面偏好</div><div class="chip-group" data-name="surface"><div class="chip active" data-value="paved">柏油路</div><div class="chip" data-value="greenway">绿道</div><div class="chip" data-value="any">都行</div></div></div>
      <div class="form-section"><div class="form-section-title">🚗 车流偏好</div><div class="chip-group" data-name="traffic"><div class="chip active" data-value="less">尽量少</div><div class="chip" data-value="any">无所谓</div></div></div>
      <div class="form-section"><div class="form-section-title">⛰ 坡度偏好</div><div class="chip-group" data-name="slope"><div class="chip active" data-value="flat">平路为主</div><div class="chip" data-value="moderate">适当爬坡</div><div class="chip" data-value="any">无所谓</div></div></div>
      <div class="form-section"><div class="form-section-title">🧭 方向偏好</div><div class="direction-grid"><div class="dir-btn" data-value="nw">↖</div><div class="dir-btn" data-value="n">北</div><div class="dir-btn" data-value="ne">↗</div><div class="dir-btn" data-value="w">西</div><div class="dir-btn center active" data-value="any">随意</div><div class="dir-btn" data-value="e">东</div><div class="dir-btn" data-value="sw">↙</div><div class="dir-btn" data-value="s">南</div><div class="dir-btn" data-value="se">↘</div></div></div>
      <div class="form-section"><div class="form-section-title">☕ 途经目的地</div><div style="position:relative"><input class="form-input" id="pi" placeholder="搜索具体店名" autocomplete="off"><div class="sbox" id="ps"></div></div><div class="quick-poi"><div class="qp" data-type="咖啡店">☕ 咖啡店</div><div class="qp" data-type="便利店">🏪 便利店</div><div class="qp" data-type="公园">🌳 公园</div><div class="qp" data-type="餐厅">🍜 餐厅</div></div><div class="poi-tags" id="pt"></div></div>
    </div>
    <div class="sidebar-footer"><button class="gen-btn" id="gb">🚴 生成骑行路线</button></div>
  </div>
  <div class="main">
    <div id="map-container"><div class="mempty" id="me"><div style="font-size:48px;color:var(--border);margin-bottom:16px">🚴</div><div style="color:var(--text-dim);font-size:15px;text-align:center;line-height:1.6">设置出发点和偏好<br>点击「生成骑行路线」开始</div></div></div>
    <div class="rpanel" id="rp"></div>
    <div class="lov" id="lov"><div class="lspin"></div><div class="ltxt">正在规划路线...</div></div>
    <div class="epanel" id="ep"><div class="etitle">📈 坡度剖面</div><canvas id="ecanvas"></canvas></div>
  </div>
</div>
<div class="noti" id="noti"></div>
<div id="dbg"></div>

<script>
var D=document.getElementById('dbg');
function L(m){var d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+' '+m;D.appendChild(d);D.scrollTop=1e6;console.log('[RG]',m)}
L('Page loaded, requesting AMap SDK...');
</script>

<script>
window._AMapSecurityConfig={securityJsCode:'0fffd5de76e94c3ddd7ac4aebe71f9fb'};
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=a6d81f0dd00a39595187f335361ae4e7&plugin=AMap.Riding,AMap.Geocoder,AMap.PlaceSearch,AMap.AutoComplete&callback=_amapCb"></script>
<script>
window._amapCb=function(){
  L('_amapCb fired! AMap='+typeof AMap);
  if(typeof AMap!=='undefined') run();
  else L('ERROR: AMap is undefined in callback');
};
setTimeout(function(){
  L('Timeout check: AMap='+typeof window.AMap);
  if(typeof window.AMap!=='undefined'&&!window._started){L('Starting via timeout');run();}
  else if(typeof window.AMap==='undefined') L('FATAL: AMap never loaded');
},6000);

function run(){
  if(window._started)return;window._started=true;
  L('run() called');
  var S={startPoint:null,distance:30,area:'suburban',surface:'paved',traffic:'less',slope:'flat',direction:'any',pois:[],routes:[],activeRoute:0};
  var map,geo,ps,ac,rpl=[],mg=[],rc=['#4ade80','#60a5fa','#fb923c'];

  function init(){
    map=new AMap.Map('map-container',{zoom:12,center:[116.397428,39.90923],mapStyle:'amap://styles/dark',viewMode:'2D'});
    L('Map created');
    geo=new AMap.Geocoder();ps=new AMap.PlaceSearch({pageSize:5});ac=new AMap.AutoComplete({city:'全国'});
    L('ac='+!!ac+' ps='+!!ps+' geo='+!!geo);

    map.on('click',function(e){
      geo.getAddress([e.lnglat.lng,e.lnglat.lat],function(st,r){
        if(st==='complete'){S.startPoint={lng:e.lnglat.lng,lat:e.lnglat.lat,name:r.regeocode.formattedAddress};document.getElementById('si').value=S.startPoint.name;asm();noti('已设置出发点','success');}
      });
    });
  }

  function asm(){
    mg.forEach(function(m){if(m._s)map.remove(m)});mg=mg.filter(function(m){return!m._s});
    if(!S.startPoint)return;
    var m=new AMap.Marker({position:[S.startPoint.lng,S.startPoint.lat],content:'<div style="width:24px;height:24px;background:#4ade80;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',offset:new AMap.Pixel(-12,-12)});
    m._s=true;map.add(m);mg.push(m);map.setCenter([S.startPoint.lng,S.startPoint.lat]);
  }

  // Start search
  var st;
  document.getElementById('si').addEventListener('input',function(){
    clearTimeout(st);var v=this.value.trim(),c=document.getElementById('ss');
    if(v.length<2){c.classList.remove('show');return;}
    st=setTimeout(function(){
      L('search: '+v);
      ac.search(v,function(s,r){
        L('ac result: '+s);
        if(s==='complete'&&r.tips){
          var items=r.tips.filter(function(t){return t.location}).slice(0,5);
          if(items.length>0){showS(c,items.map(function(t){return{name:t.name,dist:t.district||'',lng:t.location.lng,lat:t.location.lat}}));return;}
        }
        L('fallback to ps');
        ps.search(v,function(s2,r2){
          L('ps result: '+s2);
          if(s2==='complete'&&r2.poiList){showS(c,r2.poiList.pois.slice(0,5).map(function(p){return{name:p.name,dist:p.address||'',lng:p.location.lng,lat:p.location.lat}}));}
          else showS(c,[]);
        });
      });
    },400);
  });

  function showS(c,items){
    c.innerHTML='';
    if(!items.length){c.classList.remove('show');return;}
    items.forEach(function(it){
      var d=document.createElement('div');d.className='si';
      d.innerHTML=it.name+(it.dist?'<div class="ad">'+it.dist+'</div>':'');
      d.onclick=function(){S.startPoint={lng:it.lng,lat:it.lat,name:it.name};document.getElementById('si').value=it.name;c.classList.remove('show');asm();map.setZoomAndCenter(13,[it.lng,it.lat]);};
      c.appendChild(d);
    });
    c.classList.add('show');L('showing '+items.length+' suggestions');
  }

  // POI search
  var pt;
  document.getElementById('pi').addEventListener('input',function(){
    clearTimeout(pt);var v=this.value.trim(),c=document.getElementById('ps');
    if(v.length<2){c.classList.remove('show');return;}
    pt=setTimeout(function(){
      ps.search(v,function(s,r){
        if(s==='complete'&&r.poiList){
          c.innerHTML='';
          r.poiList.pois.slice(0,5).forEach(function(p){
            var d=document.createElement('div');d.className='si';
            d.innerHTML=p.name+'<div class="ad">'+(p.address||'')+'</div>';
            d.onclick=function(){S.pois.push({name:p.name,type:'exact',location:{lng:p.location.lng,lat:p.location.lat}});rpt();document.getElementById('pi').value='';c.classList.remove('show');};
            c.appendChild(d);
          });
          c.classList.add('show');
        }
      });
    },400);
  });

  document.addEventListener('click',function(e){
    if(!e.target.closest('#si')&&!e.target.closest('#ss'))document.getElementById('ss').classList.remove('show');
    if(!e.target.closest('#pi')&&!e.target.closest('#ps'))document.getElementById('ps').classList.remove('show');
  });

  document.getElementById('ds').oninput=function(){S.distance=+this.value;document.getElementById('dd').textContent=S.distance;};

  document.querySelectorAll('.chip-group').forEach(function(g){
    g.querySelectorAll('.chip').forEach(function(c){
      c.onclick=function(){g.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active')});c.classList.add('active');S[g.dataset.name]=c.dataset.value;};
    });
  });
  document.querySelectorAll('.dir-btn').forEach(function(b){
    b.onclick=function(){document.querySelectorAll('.dir-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active');S.direction=b.dataset.value;};
  });
  document.querySelectorAll('.qp').forEach(function(c){
    c.onclick=function(){var t=c.dataset.type;c.classList.toggle('sel');
      if(c.classList.contains('sel'))S.pois.push({name:t,type:'category'});
      else S.pois=S.pois.filter(function(p){return!(p.name===t&&p.type==='category')});
      rpt();};
  });

  function rpt(){
    var c=document.getElementById('pt');c.innerHTML='';
    S.pois.forEach(function(p,i){
      var t=document.createElement('div');t.className='poi-tag';
      t.innerHTML=(p.type==='exact'?'📍':'🏷')+' '+p.name+' <span class="rm" data-i="'+i+'">✕</span>';
      c.appendChild(t);
    });
    c.querySelectorAll('.rm').forEach(function(b){
      b.onclick=function(){var x=+b.dataset.i,rm=S.pois[x];S.pois.splice(x,1);
        if(rm.type==='category')document.querySelectorAll('.qp').forEach(function(c){if(c.dataset.type===rm.name)c.classList.remove('sel')});
        rpt();};
    });
  }

  function noti(m,t){var e=document.getElementById('noti');e.textContent=(t==='error'?'⚠ ':'✓ ')+m;e.className='noti '+(t||'');setTimeout(function(){e.classList.add('show')},10);setTimeout(function(){e.classList.remove('show')},3000);}

  function gda(d){var a={n:90,ne:45,e:0,se:-45,s:-90,sw:-135,w:180,nw:135};return a[d]!==undefined?a[d]:null;}
  function gwp(c,dk,dir){
    var R=dk/(2*Math.PI)*1.3,n=4,w=[],ba=gda(dir);
    for(var i=0;i<n;i++){
      var ang;if(ba!==null)ang=ba-60+(120/(n-1))*i;else ang=(360/n)*i+(Math.random()*30-15);
      var rad=ang*Math.PI/180,r=R*(.7+Math.random()*.3);
      w.push({lng:c.lng+(r/(111*Math.cos(c.lat*Math.PI/180)))*Math.cos(rad),lat:c.lat+(r/111)*Math.sin(rad)});
    }return w;
  }
  function rr(o,d){
    return new Promise(function(res){
      var r=new AMap.Riding({hideMarkers:true,autoFitView:false});
      r.search(new AMap.LngLat(o.lng,o.lat),new AMap.LngLat(d.lng,d.lat),function(s,result){
        try{r.clear()}catch(e){}
        if(s==='complete'&&result.routes&&result.routes.length)res(result.routes[0]);else{L('ride fail:'+s);res(null);}
      });
    });
  }
  function ep(route){
    var p=[];var segs=route.rides||route.steps||[];
    segs.forEach(function(s){(s.path||[]).forEach(function(pt){try{p.push({lng:pt.lng||pt.getLng(),lat:pt.lat||pt.getLat()})}catch(e){}})});
    if(!p.length&&route.path)route.path.forEach(function(pt){try{p.push({lng:pt.lng||pt.getLng(),lat:pt.lat||pt.getLat()})}catch(e){}});
    return p;
  }
  function scpoi(path){
    var cats=S.pois.filter(function(p){return p.type==='category'});
    if(!cats.length)return Promise.resolve([]);
    var mid=path[Math.floor(path.length/2)],res=[];
    return Promise.all(cats.map(function(cp){
      return new Promise(function(rv){
        ps.searchNearBy(cp.name,[mid.lng,mid.lat],3000,function(s,r){
          if(s==='complete'&&r.poiList)r.poiList.pois.slice(0,2).forEach(function(p){res.push({name:p.name,location:{lng:p.location.lng,lat:p.location.lat},type:cp.name})});
          rv();
        });
      });
    })).then(function(){return res});
  }
  function mel(n,sl){var p=[],e=50+Math.random()*30,mv=sl==='flat'?5:sl==='moderate'?15:10;for(var i=0;i<Math.min(n,200);i++){var pr=i/Math.min(n,200);e+=(Math.random()-.5)*2;p.push(Math.max(10,e+Math.sin(pr*Math.PI*3)*mv+Math.sin(pr*Math.PI*7)*mv*.3))}return p}

  async function gor(idx){
    var c=S.startPoint,wps=gwp(c,S.distance,S.direction);
    S.pois.filter(function(p){return p.type==='exact'}).forEach(function(p,i){if(i<wps.length)wps[i]={lng:p.location.lng,lat:p.location.lat}});
    var pts=[c].concat(wps).concat([c]),fp=[],td=0,tt=0;
    for(var i=0;i<pts.length-1;i++){L('seg '+i);var r=await rr(pts[i],pts[i+1]);if(r){td+=r.distance;tt+=r.time;fp=fp.concat(ep(r))}}
    var fpoi=await scpoi(fp);
    return{index:idx,path:fp,distance:td,time:tt,elevation:mel(fp.length,S.slope),pois:S.pois.filter(function(p){return p.type==='exact'}).map(function(p){return{name:p.name,location:p.location,type:'指定'}}).concat(fpoi)};
  }

  async function gen(){
    if(!S.startPoint){noti('请先设置出发点','error');return}
    document.getElementById('gb').disabled=true;document.getElementById('lov').classList.add('show');document.getElementById('me').style.display='none';
    rpl.forEach(function(p){map.remove(p)});rpl=[];mg.forEach(function(m){if(!m._s)map.remove(m)});mg=mg.filter(function(m){return m._s});
    try{
      var routes=[];
      for(var i=0;i<2;i++){L('gen route '+i);var r=await gor(i);if(r&&r.path.length)routes.push(r)}
      if(!routes.length){noti('路线规划失败','error');return}
      S.routes=routes;S.activeRoute=0;rrs();rrcs();sel(0);
      document.getElementById('rp').classList.add('show');document.getElementById('ep').classList.add('show');
    }catch(e){L('ERR:'+e.message);noti('出错了','error')}
    finally{document.getElementById('gb').disabled=false;document.getElementById('lov').classList.remove('show')}
  }

  function rrs(){
    rpl.forEach(function(p){map.remove(p)});rpl=[];
    S.routes.forEach(function(r,i){
      var path=r.path.map(function(p){return[p.lng,p.lat]}),ia=i===S.activeRoute;
      var sh=new AMap.Polyline({path:path,strokeColor:rc[i],strokeWeight:ia?10:6,strokeOpacity:.15,lineJoin:'round',lineCap:'round'});
      var ln=new AMap.Polyline({path:path,strokeColor:rc[i],strokeWeight:ia?5:3,strokeOpacity:ia?.9:.4,lineJoin:'round',lineCap:'round'});
      ln.on('click',function(){sel(i)});map.add(sh);map.add(ln);rpl.push(sh,ln);
    });
    map.setFitView(null,false,[60,60,160,400]);
  }
  function rpm(r){
    mg.forEach(function(m){if(!m._s)map.remove(m)});mg=mg.filter(function(m){return m._s});
    r.pois.forEach(function(p){
      var m=new AMap.Marker({position:[p.location.lng,p.location.lat],content:'<div style="background:#1a1d27;border:1px solid #60a5fa;border-radius:8px;padding:4px 8px;font-size:11px;color:#60a5fa;white-space:nowrap">📍 '+p.name+'</div>',offset:new AMap.Pixel(-40,-12)});
      map.add(m);mg.push(m);
    });
  }
  function rrcs(){
    var panel=document.getElementById('rp');panel.innerHTML='';
    S.routes.forEach(function(r,i){
      var dk=(r.distance/1000).toFixed(1),tm=Math.round(r.time/60),h=Math.floor(tm/60),m=tm%60,ts=h?h+'h '+m+'m':m+'min';
      var cl=0;for(var j=1;j<r.elevation.length;j++)if(r.elevation[j]>r.elevation[j-1])cl+=r.elevation[j]-r.elevation[j-1];
      var cd=document.createElement('div');cd.className='rcard'+(i===S.activeRoute?' active':'');
      cd.innerHTML='<div class="rcard-head"><div class="rcard-title" style="color:'+rc[i]+'">路线 '+['A','B','C'][i]+'</div><div class="rcard-badge" style="background:'+rc[i]+'20;color:'+rc[i]+'">'+dk+' km</div></div><div class="rstats"><div><div class="rsl">预计时间</div><div class="rsv">'+ts+'</div></div><div><div class="rsl">总爬升</div><div class="rsv">+'+cl.toFixed(0)+'m</div></div><div><div class="rsl">最高海拔</div><div class="rsv">'+Math.max.apply(null,r.elevation).toFixed(0)+'m</div></div><div><div class="rsl">沿途POI</div><div class="rsv">'+r.pois.length+'个</div></div></div>';
      cd.onclick=function(){sel(i)};panel.appendChild(cd);
    });
  }
  function sel(i){S.activeRoute=i;rrs();rrcs();rpm(S.routes[i]);de(S.routes[i]);asm()}
  function de(r){
    var cv=document.getElementById('ecanvas'),cx=cv.getContext('2d'),dp=devicePixelRatio||1;
    cv.width=cv.offsetWidth*dp;cv.height=cv.offsetHeight*dp;cx.scale(dp,dp);
    var w=cv.offsetWidth,h=cv.offsetHeight,d=r.elevation,mn=Math.min.apply(null,d)-5,mx=Math.max.apply(null,d)+5,rg=mx-mn;
    cx.clearRect(0,0,w,h);cx.strokeStyle='#2e3345';cx.lineWidth=.5;
    for(var i=0;i<4;i++){var y=h/4*i+5;cx.beginPath();cx.moveTo(0,y);cx.lineTo(w,y);cx.stroke()}
    var g=cx.createLinearGradient(0,0,0,h),co=rc[r.index]||'#4ade80';g.addColorStop(0,co+'40');g.addColorStop(1,co+'05');
    cx.beginPath();cx.moveTo(0,h);d.forEach(function(v,i){cx.lineTo(i/(d.length-1)*w,h-(v-mn)/rg*(h-10))});cx.lineTo(w,h);cx.closePath();cx.fillStyle=g;cx.fill();
    cx.beginPath();d.forEach(function(v,i){var x=i/(d.length-1)*w,y=h-(v-mn)/rg*(h-10);i?cx.lineTo(x,y):cx.moveTo(x,y)});cx.strokeStyle=co;cx.lineWidth=2;cx.stroke();
    cx.fillStyle='#8b8fa3';cx.font='10px "Space Mono",monospace';cx.fillText(mx.toFixed(0)+'m',4,14);cx.fillText(mn.toFixed(0)+'m',4,h-4);cx.fillText((r.distance/1000).toFixed(1)+'km',w-45,h-4);
  }

  document.getElementById('gb').onclick=gen;
  init();
}
</script>
